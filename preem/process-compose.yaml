version: "0.5"

env_cmds:
  APP_DEV_PORT: ephemeral-port-reserve
  APP_DB_PORT: ephemeral-port-reserve

processes:
  postgres:
    command: pgdb --port $${APP_DB_PORT}
    readiness_probe:
      exec:
        command: pg_isready --host 127.0.0.1 --port $${APP_DB_PORT} --username dev --dbname dev
      period_seconds: 1
      timeout_seconds: 1
      failure_threshold: 30

  backend:
    working_dir: backend
    command: |
      exec ./target/debug/myapp - <<EOF
      listen_address = "127.0.0.1:$${APP_DEV_PORT}"
      database_url = "postgres://dev:dev@127.0.0.1:$${APP_DB_PORT}/dev"
      frontend = "../frontend/dist"
      log_filter = "myapp=debug,tower_http=debug"
      EOF
    depends_on:
      postgres:
        condition: process_healthy
