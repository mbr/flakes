version: "0.5"

env_cmds:
  APP_DEV_PORT: ephemeral-port-reserve
  APP_DB_PORT: ephemeral-port-reserve

processes:
  postgres:
    command: pgdb --port $${APP_DB_PORT}
    readiness_probe:
      exec:
        command: pg_isready --host 127.0.0.1 --port $${APP_DB_PORT} --username dev --dbname dev
      period_seconds: 1
      timeout_seconds: 1
      failure_threshold: 30

  frontend:
    working_dir: frontend
    command: >-
      watchexec --restart
      --watch build.sh
      --watch elm.json
      --watch src
      --watch css
      --watch public
      --debounce 1s
      -- ./build.sh

  backend:
    working_dir: backend
    command: |
      runtime_dir="$$(mktemp -d)"
      config="$${runtime_dir}/config.toml"
      trap 'rm -rf "$${runtime_dir}"' EXIT

      cat > "$${config}" <<EOF
      bind_address = "127.0.0.1:$${APP_DEV_PORT}"
      database_url = "postgres://dev:dev@127.0.0.1:$${APP_DB_PORT}/dev"
      frontend = "../frontend/dist"
      log_filter = "myapp=debug,tower_http=debug"
      EOF

      watchexec --restart \
        --watch Cargo.toml \
        --watch Cargo.lock \
        --watch migrations \
        --watch src \
        --debounce 1s \
        -- cargo run -- "$${config}"
    depends_on:
      postgres:
        condition: process_healthy
